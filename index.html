<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Manasvi 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a26;--gold:#f6d27a;--rose:#ff8fb1;--ink:#050405;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse at 50% 0,#2a1250,var(--bg) 60%);color:var(--ink);font-family:'Poppins',system-ui,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden;height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
section{position:relative;z-index:1}
.script{font-family:'Dancing Script','Brush Script MT',cursive;color:var(--gold)}
/* HERO */
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:20px}
#hero h2{font-size:clamp(28px,7vw,40px);text-shadow:0 0 18px #f6d27a66}
.stage{perspective:1000px}
.env{position:relative;width:min(80vw,340px);aspect-ratio:340/220;transform-style:preserve-3d;transition:transform 1.2s ease,opacity 1s ease;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotateX(6deg)}}
.env>div{position:absolute;inset:0;border-radius:10px}
.eback{background:#d9bfa8;box-shadow:0 20px 60px #000a,0 0 60px #f6d27a22}
.letter{inset:6px 12px!important;background:linear-gradient(#fff9f2,#f6e7d8);color:#6a2c45;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(20px,6vw,28px);transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .5s;z-index:2}
.efront{background:linear-gradient(135deg,#ecd5be,#dcc0a6);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);z-index:3}
.flap{background:linear-gradient(#e8d0b8,#d4b79c);clip-path:polygon(0 0,100% 0,50% 62%);transform-origin:top;transition:transform 1.1s cubic-bezier(.5,0,.2,1),z-index 0s .5s;z-index:4;backface-visibility:visible}
.seal{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0453c,#8c1a1a);box-shadow:0 3px 8px #0008;z-index:6;transition:opacity .4s,transform .4s}
.to{position:absolute;left:0;right:0;bottom:12%;text-align:center;z-index:5;font-size:clamp(20px,6vw,26px);color:#5a2a30;transition:opacity .4s}
.to small{font-family:'Poppins';font-size:12px;opacity:.6;margin-right:6px}
.env.open{animation:none;transform:rotateX(8deg)}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .letter{transform:translateY(-62%) scale(1.06)}
.env.open .seal,.env.open .to{opacity:0;transform:scale(.4)}
.env.gone{transform:scale(1.5) translateY(-30px);opacity:0}
.slider{position:relative;width:min(80vw,340px);height:58px;border:1px solid #f6d27a66;border-radius:40px;background:#ffffff0d;display:flex;align-items:center;justify-content:center;touch-action:none;transition:opacity .6s}
.slider span{font-size:clamp(17px,5vw,22px);color:var(--gold);padding-left:36px;pointer-events:none}
.knob{position:absolute;left:5px;top:5px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb3c8,#e0457b);display:grid;place-items:center;font-size:24px;cursor:grab;box-shadow:0 0 16px #ff8fb1aa;touch-action:none}
.hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;opacity:0;transition:opacity 1s;font-size:14px;color:var(--gold)}
.hint.on{opacity:1;animation:nudge 1.6s infinite}
@keyframes nudge{50%{transform:translateY(8px)}}
/* generic reveal */
.rv{opacity:0;transform:translateY(40px);transition:1s ease}.rv.in{opacity:1;transform:none}
/* RING */
#ring{min-height:110vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;padding:60px 0}
#ring h2{font-size:clamp(30px,8vw,48px);text-align:center;padding:0 16px}
#ring p{opacity:.7;font-size:14px;margin-bottom:10px}
.scene{--w:120px;--R:230px;width:var(--w);height:calc(var(--w)*1.4);perspective:1100px;margin:90px 0;position:relative}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-10deg)}
.spin{position:absolute;inset:0;transform-style:preserve-3d;animation:spin 26s linear infinite}
.scene:hover .spin{animation-play-state:paused}
@keyframes spin{to{transform:rotateY(360deg)}}
.card{position:absolute;inset:0;border-radius:12px;overflow:hidden;border:2px solid #ffffffcc;box-shadow:0 0 22px #ff8fb166;transform:rotateY(calc(var(--i)*36deg)) translateZ(var(--R));background:#222}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.centercat{position:absolute;left:50%;top:50%;width:calc(var(--w)*1.35);transform:translate(-50%,-50%);animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 20px #ff8fb1aa);border-radius:14px;z-index:0}
@keyframes float{50%{transform:translate(-50%,-56%) rotate(3deg)}}
@media(min-width:700px){.scene{--w:170px;--R:330px}}
/* STORY */
#story{height:420vh}
.sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 22px 24px}
.box{max-width:640px;padding:28px 22px;border-radius:22px;background:#ffffff0a;border:1px solid #ffffff1c;backdrop-filter:blur(6px);box-shadow:0 0 60px #ff8fb122}
.box h3{font-size:clamp(34px,9vw,52px);margin-bottom:12px;line-height:1.1}
.txt{font-size:clamp(14.5px,3.9vw,20px);line-height:1.65;font-weight:300}
.w{display:inline-block;white-space:nowrap}
.l{display:inline-block;opacity:0;transform:translateY(28px) translateX(-14px) rotate(-8deg) scale(.6);filter:blur(6px);transition:all .6s cubic-bezier(.2,.9,.3,1.3)}
.l.on{opacity:1;transform:none;filter:none;text-shadow:0 0 12px #ff8fb155}
.l.sp{width:.3em}
.bar{position:absolute;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--rose),var(--gold));width:0;z-index:5}
/* END */
#end{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:60px 20px}
#end img{width:min(78vw,340px);border-radius:24px;box-shadow:0 0 70px #ff8fb188;transform:scale(.6) rotate(-6deg);opacity:0;transition:1.1s cubic-bezier(.2,1.4,.4,1)}
#end.in img{transform:scale(1) rotate(0);opacity:1;animation:wob 3s 1.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(2.5deg) scale(1.03)}}
#end h2{font-size:clamp(28px,8vw,42px);text-align:center}
.btn{border:0;border-radius:40px;padding:14px 30px;font:500 16px Poppins,sans-serif;color:#2a0f2e;background:linear-gradient(135deg,#ffc2d4,#f6d27a);cursor:pointer;box-shadow:0 0 28px #ff8fb188;transition:transform .2s}
.btn:active{transform:scale(.94)}
.heart{position:fixed;pointer-events:none;z-index:50;font-size:22px;animation:up 2.2s ease-out forwards}
@keyframes up{to{transform:translate(var(--dx),-70vh) rotate(var(--r));opacity:0}}
</style></head><body class="lock">
<canvas id="bg"></canvas><div class="bar" id="bar"></div>

<section id="hero">
  <h2 class="script">Something I needed to say</h2>
  <div class="stage"><div class="env" id="env">
    <div class="eback"></div>
    <div class="letter script">For you, my love 💗</div>
    <div class="efront"></div>

    <div class="to script"><small>To:</small>MANASVI</div>
  </div></div>
  <div class="slider" id="sl"><div class="knob" id="kn">🌹</div><span class="script">Slide the rose to open →</span></div>
  <div class="hint" id="hint">scroll down ↓</div>
</section>

/* background: stars + floating hearts */
const cv=document.getElementById('bg'),cx=cv.getContext('2d');let W,H,P=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<110;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,t:Math.random()*6,h:0});
for(let i=0;i<16;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*10+8,t:Math.random()*6,h:1,v:Math.random()*.0006+.0002});
(function f(){cx.clearRect(0,0,W,H);for(const p of P){p.t+=.02;if(!p.h){cx.globalAlpha=.4+.6*Math.abs(Math.sin(p.t));cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x*W,p.y*H,p.r,0,7);cx.fill()}else{p.y-=p.v;if(p.y<-.05)p.y=1.05;cx.globalAlpha=.22;cx.font=p.r+'px serif';cx.fillText('💗',p.x*W+Math.sin(p.t)*12,p.y*H)}}requestAnimationFrame(f)})();
/* ring */
const sp=document.getElementById('spin');
PHOTOS.forEach((s,i)=>{const d=document.createElement('div');d.className='card';d.style.setProperty('--i',i);d.innerHTML='<img src="'+s+'" alt="us">';sp.appendChild(d)});
document.querySelector('.scene').style.setProperty('--n',PHOTOS.length);
/* envelope slider */
const sl=document.getElementById('sl'),kn=document.getElementById('kn'),env=document.getElementById('env');
let drag=false,sx=0,max=0,done=false;
kn.addEventListener('pointerdown',e=>{if(done)return;drag=true;sx=e.clientX;max=sl.clientWidth-kn.clientWidth-10;kn.setPointerCapture(e.pointerId);kn.style.transition='none'});
kn.addEventListener('pointermove',e=>{if(!drag)return;const x=Math.max(0,Math.min(max,e.clientX-sx));kn.style.transform='translateX('+x+'px)';if(x>=max*.9)openEnv()});
kn.addEventListener('pointerup',()=>{if(done)return;drag=false;kn.style.transition='transform .4s';kn.style.transform='none'});
kn.addEventListener('keydown',e=>{if(e.key==='Enter')openEnv()});
function burst(n,x,y){const em=['💗','💖','🌹','✨','💕','🥺'];for(let i=0;i<n;i++){const h=document.createElement('div');h.className='heart';h.textContent=em[i%em.length];h.style.left=(x??Math.random()*innerWidth)+'px';h.style.top=(y??innerHeight*.9)+'px';h.style.setProperty('--dx',(Math.random()*240-120)+'px');h.style.setProperty('--r',(Math.random()*360-180)+'deg');h.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),3000)}}
function openEnv(){if(done)return;done=true;drag=false;kn.style.transform='translateX('+max+'px)';
 env.classList.add('open');burst(26);
 setTimeout(()=>{sl.style.opacity=0;env.classList.add('gone')},2600);
 setTimeout(()=>{document.body.classList.remove('lock');document.getElementById('hint').classList.add('on');
  document.getElementById('ring').scrollIntoView({behavior:'smooth'})},3500)}
/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');if(e.target.id==='end')burst(30)}}),{threshold:.25});
document.querySelectorAll('.rv,#end').forEach(el=>io.observe(el));
/* letter-by-letter story */
function split(el,txt){txt.split(' ').forEach((w,wi,a)=>{const s=document.createElement('span');s.className='w';[...w].forEach(c=>{const l=document.createElement('span');l.className='l';l.textContent=c;s.appendChild(l)});el.appendChild(s);if(wi<a.length-1){const sp=document.createElement('span');sp.className='l sp';sp.innerHTML='&nbsp;';el.appendChild(sp);}})}
